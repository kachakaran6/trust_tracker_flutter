name: trust_tracker_flutter
description: Trust Tracker - Offline-first personal finance manager
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Navigation
  go_router: ^14.1.4

  # UI & Design
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  pinput: ^5.0.0

  # Date handling
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.3.1
  flutter_slidable: ^3.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.0
  in_app_update: ^4.0.0

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Export & Documents
  pdf: ^3.10.10
  printing: ^5.11.1
  excel: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/2.png"
  min_sdk_android: 21 # android min sdk must be 21 or higher


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
