name: trust_tracker_flutter
description: Trust Tracker - Offline-first personal finance manager
publish_to: 'none'
version: 1.1.1+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_analytics: ^11.1.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3

  # Navigation
  go_router: ^14.1.4

  # UI & Design
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  pinput: ^5.0.0

  # Date handling
  intl: ^0.20.2

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.3.1
  flutter_slidable: ^3.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.0
  in_app_update: ^4.0.0
  file_picker: ^8.1.3
  permission_handler: ^11.3.1
  quick_actions: ^1.1.0
  workmanager: ^0.9.0+3
  archive: ^3.6.1
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  firebase_storage: ^12.1.1

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Export & Documents
  pdf: ^3.10.10
  printing: ^5.11.1
  excel: ^4.0.5
  image_picker: ^1.2.1
  http: ^1.6.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/2.png"
  min_sdk_android: 21 # android min sdk must be 21 or higher


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/avatars/
